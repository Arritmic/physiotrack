# Shared inference configuration for ALL 3DPCNet canonicalizer checkpoints.
#
# Every released checkpoint (S2, S3, TC48_byCam, TC48_byAction) was trained with
# this identical network architecture; only the training data / split differs
# (MMFi vs. TotalCapture-48cam, camera- vs. action-disjoint). At inference time
# only this `model:` section is consumed, so a single config serves every model
# and per-checkpoint YAMLs are unnecessary.
model:
  input_joints: 17
  encoder_type: hybrid
  rotation_type: 6d
  hidden_dim: 768
  encoder_output_dim: 384
  dropout: 0.15
  predict_mode: rotation_plus_residual
  num_layers: 3
  hybrid:
    gcn_hidden_dim: 192
    transformer_hidden_dim: 256
    num_gcn_layers: 3
    num_transformer_layers: 2
    num_heads: 8
    use_learnable_graph: true
    use_multi_scale: true
