name: Tests

# Runs the test suite on every push and pull request. Also exposed as a reusable
# workflow (`workflow_call`) so the release pipeline gates on it instead of
# duplicating this setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags, so it needs full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        # The default PyPI wheels pull the full CUDA stack, which is unnecessary on
        # CI runners and far slower to install. Resolve torch from the CPU index
        # first so the editable install below reuses it.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install physiotrack with test extras
        run: pip install -e ".[test]"

      - name: Verify the NeuroKit2 reference implementation is present
        # The HRV and artefact-correction tests cross-check against NeuroKit2 behind
        # importorskip. If it were missing they would skip silently and the suite
        # would pass while validating nothing. Fail loudly instead.
        run: python -c "import neurokit2; print('neurokit2', neurokit2.__version__)"

      - name: Run tests
        run: pytest -q --cov=physiotrack --cov-report=term-missing --cov-report=xml

      - name: Fail if any test was skipped unexpectedly
        # A skip here means an optional dependency vanished from the test extra,
        # which silently weakens the suite. Surface it rather than hiding it.
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest-report.txt
          if grep -qE "^SKIPPED" pytest-report.txt; then
            echo "::error::Tests were skipped. Every test must run in CI:"
            grep -E "^SKIPPED" pytest-report.txt
            exit 1
          fi

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
